# Used by Coolify (Docker Compose build pack) or `docker compose up`, set the variables in Coolify or a local .env
services:
  cctv:
    build: .
    restart: unless-stopped
    environment:
      EZVIZ_EMAIL: ${EZVIZ_EMAIL:?}
      EZVIZ_PASSWORD: ${EZVIZ_PASSWORD:?}
      EZVIZ_REGION: ${EZVIZ_REGION:-Asia}
      # name:SERIAL pairs separated by commas, the name is the public path: https://<domain>/<name>/index.m3u8
      CAMERAS: ${CAMERAS:?}
      # camera names streamed (and recorded) all the time instead of only while someone is watching
      ALWAYS_ON: ${ALWAYS_ON:-}
      # also serve every camera's lower resolution sub stream at <name>-sd
      SUBSTREAM: ${SUBSTREAM:-true}
      RECORD: ${RECORD:-true}
      RECORD_DELETE_AFTER: ${RECORD_DELETE_AFTER:-1d}
      # lowLatency (default) or fmp4, plain fMP4 starts slower but never trips iOS on uneven frame timing
      HLS_VARIANT: ${HLS_VARIANT:-lowLatency}
      # how often camera thumbnails are refreshed while watched and while idle (the idle one starts the camera briefly)
      THUMB_LIVE_INTERVAL: ${THUMB_LIVE_INTERVAL:-30s}
      THUMB_IDLE_INTERVAL: ${THUMB_IDLE_INTERVAL:-15m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - cctv-data:/data
    expose:
      - "8080"

volumes:
  cctv-data:
